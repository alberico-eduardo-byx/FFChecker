name: Check Feature Toggle Mentions

on:
  pull_request:
    branches: ["main", "develop"]

jobs:
  check-feature-toggle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: files
        run: |
          # Fetch the base branch to enable a proper 3-dot diff
          git fetch origin ${{ github.base_ref }} --depth=1
          # List files changed in this PR compared to the base branch
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt

      - name: Search for FeatureToggle mentions
        id: search
        run: |
          # Scan only added lines in the PR diff for the target pattern
          PATTERN='FeatureToggle\.is_feature_active'
          DIFF_OUTPUT=$(git diff --unified=0 --diff-filter=AM origin/${{ github.base_ref }}...HEAD |
            awk '
              /^\+\+\+ b\// { file = substr($0, 7); next }
              /^@@/ {
                # Extract starting line number of the new hunk (after the +)
                if (match($0, /\+([0-9]+)/, m)) { newLine = m[1] + 0 } else { newLine = 0 }
                next
              }
              # Added lines (exclude file header lines starting with +++)
              substr($0,1,1) == "+" && substr($0,1,3) != "+++" {
                print file ":" newLine ":" substr($0,2)
                newLine++
                next
              }
              # Context lines increment the line counter as well (when present)
              substr($0,1,1) == " " { newLine++; next }
              # Deleted lines do not increment newLine
            ')

          MATCHES=$(printf "%s\n" "$DIFF_OUTPUT" | grep -E "$PATTERN" || true)

          if [ -n "$MATCHES" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            {
              echo "matches<<EOF"
              echo "$MATCHES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on PR if found
        if: steps.search.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const matches = ${{ toJSON(steps.search.outputs.matches) }};
            const body = [
              '**Atenção**: Detectamos uso de `Feature Flags` neste PR.',
              '',
              'Lembre-se de atualizar a documentação de Feature Flags: [LINK_DA_DOC](https://grupobyx.atlassian.net/wiki/spaces/Tecnologia/pages/1203339279/RFC+5+-+Features+Flags)',
              '',
              'Arquivos/linhas encontrados:',
              '```',
              matches,
              '```',
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
