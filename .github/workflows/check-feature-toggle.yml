name: Check Feature Toggle Mentions

on:
  pull_request:
    branches: ["main", "develop"]

jobs:
  check-feature-toggle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: files
        run: |
          # Fetch the base branch to enable a proper 3-dot diff
          git fetch origin ${{ github.base_ref }} --depth=1
          # List files changed in this PR compared to the base branch
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt

      - name: Search for FeatureToggle mentions
        id: search
        run: |
          # Scan only added lines in the PR diff for the target pattern
          PATTERN='FeatureToggle\.is_feature_active'
          DIFF_OUTPUT=$(git diff --unified=0 --diff-filter=AM origin/${{ github.base_ref }}...HEAD |
            awk '
              # Capture old and new file names
              /^--- a\// { oldFile = substr($0, 7); next }
              /^\+\+\+ b\// { newFile = substr($0, 7); next }
              /^@@/ {
                # Extract starting line numbers for old and new hunks
                if (match($0, /-([0-9]+)/, m1)) { oldLine = m1[1] + 0 } else { oldLine = 0 }
                if (match($0, /\+([0-9]+)/, m2)) { newLine = m2[1] + 0 } else { newLine = 0 }
                next
              }
              # Added lines (exclude file header lines starting with +++)
              substr($0,1,1) == "+" && substr($0,1,3) != "+++" {
                fileToUse = (newFile != "" ? newFile : oldFile)
                print "ADD " fileToUse ":" newLine ":" substr($0,2)
                newLine++
                next
              }
              # Removed lines (exclude file header lines starting with ---)
              substr($0,1,1) == "-" && substr($0,1,3) != "---" {
                fileToUse = (oldFile != "" ? oldFile : newFile)
                print "DEL " fileToUse ":" oldLine ":" substr($0,2)
                oldLine++
                next
              }
              # Context lines increment both counters when present
              substr($0,1,1) == " " { oldLine++; newLine++; next }
            ')

          ADDED=$(printf "%s\n" "$DIFF_OUTPUT" | grep '^ADD ' | sed 's/^ADD //' | grep -E "$PATTERN" || true)
          REMOVED=$(printf "%s\n" "$DIFF_OUTPUT" | grep '^DEL ' | sed 's/^DEL //' | grep -E "$PATTERN" || true)

          # Extract feature flag names (string literals) from added/removed lines
          # Matches FeatureToggle.is_feature_active('FlagName') or with double quotes
          ADDED_FLAGS=$(printf "%s\n" "$ADDED" |
            grep -oE "FeatureToggle\\.is_feature_active\\(['\"][^'\"]+['\"]\\)" |
            sed -E "s/.*is_feature_active\\(['\"]([^'\"]+)['\"]\\).*/\\1/" |
            sort -u || true)

          REMOVED_FLAGS=$(printf "%s\n" "$REMOVED" |
            grep -oE "FeatureToggle\\.is_feature_active\\(['\"][^'\"]+['\"]\\)" |
            sed -E "s/.*is_feature_active\\(['\"]([^'\"]+)['\"]\\).*/\\1/" |
            sort -u || true)

          FOUND=false
          if [ -n "$ADDED" ]; then
            echo "added_found=true" >> "$GITHUB_OUTPUT"
            {
              echo "added_matches<<EOF"
              echo "$ADDED"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            {
              echo "added_flags<<EOF"
              echo "$ADDED_FLAGS"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            FOUND=true
          else
            echo "added_found=false" >> "$GITHUB_OUTPUT"
            {
              echo "added_matches<<EOF"
              echo ""
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            {
              echo "added_flags<<EOF"
              echo ""
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$REMOVED" ]; then
            echo "removed_found=true" >> "$GITHUB_OUTPUT"
            {
              echo "removed_matches<<EOF"
              echo "$REMOVED"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            {
              echo "removed_flags<<EOF"
              echo "$REMOVED_FLAGS"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            FOUND=true
          else
            echo "removed_found=false" >> "$GITHUB_OUTPUT"
            {
              echo "removed_matches<<EOF"
              echo ""
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            {
              echo "removed_flags<<EOF"
              echo ""
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

          if [ "$FOUND" = true ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on PR if found
        if: steps.search.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const added = ${{ toJSON(steps.search.outputs.added_matches) }};
            const removed = ${{ toJSON(steps.search.outputs.removed_matches) }};
            const addedFlagsStr = ${{ toJSON(steps.search.outputs.added_flags) }};
            const removedFlagsStr = ${{ toJSON(steps.search.outputs.removed_flags) }};

            const sections = [
              '**Atenção**: Detectamos uso de `Feature Flags` neste PR.',
              '',
              'Lembre-se de atualizar a documentação de Feature Flags: [LINK_DA_DOC](https://grupobyx.atlassian.net/wiki/spaces/Tecnologia/pages/1203339279/RFC+5+-+Features+Flags)',
              ''
            ];

            const addedFlags = addedFlagsStr.split('\n').map(s => s.trim()).filter(Boolean);
            const removedFlags = removedFlagsStr.split('\n').map(s => s.trim()).filter(Boolean);

            if (addedFlags.length) {
              sections.push('Flags adicionadas:');
              sections.push(...addedFlags.map(f => `- ${f}`));
              sections.push('');
            }

            if (added.trim()) {
              sections.push(
                'Aparições (linhas adicionadas):',
                '```',
                added,
                '```',
                ''
              );
            }

            if (removedFlags.length) {
              sections.push('Flags removidas:');
              sections.push(...removedFlags.map(f => `- ${f}`));
              sections.push('');
            }

            if (removed.trim()) {
              sections.push(
                'Aparições (linhas removidas):',
                '```',
                removed,
                '```',
                ''
              );
            }

            const body = sections.join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
