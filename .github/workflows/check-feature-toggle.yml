name: Check Feature Toggle Mentions

on:
  pull_request:
    branches: ["main", "develop"]

jobs:
  check-feature-toggle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: files
        run: |
          # Fetch the base branch to enable a proper 3-dot diff
          git fetch origin ${{ github.base_ref }} --depth=1
          # List files changed in this PR compared to the base branch
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt

      - name: Search for FeatureToggle mentions
        id: search
        run: |
          MATCHES=""
          while IFS= read -r file; do
            if [[ -f "$file" ]]; then
              FOUND=$(grep -nI -E "FeatureToggle\.is_feature_active" "$file" || true)
              if [ -n "$FOUND" ]; then
                MATCHES="$MATCHES\n$file:\n$FOUND"
              fi
            fi
          done < changed_files.txt

          if [ -n "$MATCHES" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            {
              echo "matches<<EOF"
              echo -e "$MATCHES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on PR if found
        if: steps.search.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Safely capture multiline output from previous step
            const matches = ${{ toJSON(steps.search.outputs.matches) }};
            const marker = '<!-- feature-toggle-check -->';
            const body = [
              marker,
              '**Atenção**: Detectamos uso de `FeatureToggle.is_feature_active` neste PR.',
              '',
              'Lembre-se de atualizar a documentação de Feature Flags: LINK_DA_DOC',
              '',
              'Arquivos/linhas encontrados:',
              '```',
              matches,
              '```',
            ].join('\n');

            // Avoid duplicate comments: update existing if marker is found
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
